      x-roles: [admin, operator]
      security:
        - bearerAuth: []
        - apiKeyAuth: ['products:read']
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Products]
      operationId: updateProduct
      summary: Actualiza o desactiva (`status=inactive`) un producto
      x-roles: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/subscriptions:
    get:
      tags: [Subscriptions]
      operationId: listSubscriptions
      summary: Lista suscripciones con filtros y paginación
      description: Las integraciones nunca reciben `supplierCostAmount` ni `notes`.
      x-roles: [admin, operator]
      security:
        - bearerAuth: []
        - apiKeyAuth: ['subscriptions:read']
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - name: clientId
          in: query
          schema: { type: string, format: uuid }
        - name: productId
          in: query
          schema: { type: string, format: uuid }
        - name: ownerUserId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: Multivalor `SubscriptionStatus`
          schema: { type: string, examples: ['active,in_renewal'] }
        - name: followUpStatus
          in: query
          schema: { $ref: '#/components/schemas/FollowUpStatus' }
        - name: paymentStatus
          in: query
          description: Estado de pago del periodo vigente
          schema: { $ref: '#/components/schemas/PaymentStatus' }
        - name: expiresFrom
          in: query
          schema: { type: string, format: date }
        - name: expiresTo
          in: query
          schema: { type: string, format: date }
        - name: sort
          in: query
          schema: { type: string, enum: [currentPeriodEnd, -currentPeriodEnd, createdAt, -createdAt, clientName, -clientName], default: currentPeriodEnd }
      responses:
        '200':
          description: Página de suscripciones
          headers:
            RateLimit: { $ref: '#/components/headers/RateLimit' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Subscriptions]
      operationId: createSubscription
      summary: Crea una suscripción y su periodo 1 (Flujo A)
      description: |
        Valida cliente no archivado y producto activo. Crea el periodo 1, programa las alertas y audita `subscription.created`.
        `supplierCostAmount` sólo puede fijarlo un admin.
      x-roles: [admin, operator]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionCreate' }
      responses:
        '201':
          description: Suscripción creada
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/subscriptions/expiring:
    get:
      tags: [Subscriptions]
      operationId: listExpiringSubscriptions
      summary: Suscripciones activas o en renovación que vencen en los próximos N días (Flujo D)
      description: 'Rango: hoy ≤ currentPeriodEnd ≤ hoy + withinDays, con "hoy" en America/Bogota. Orden ascendente por vencimiento.'
      x-roles: [admin, operator]
      security:
        - bearerAuth: []
        - apiKeyAuth: ['subscriptions:read']
      parameters:
        - name: withinDays
          in: query
          schema: { type: integer, minimum: 0, maximum: 365, default: 30 }
        - name: clientId
          in: query
          schema: { type: string, format: uuid }
        - name: ownerUserId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de suscripciones por vencer
          headers:
            RateLimit: { $ref: '#/components/headers/RateLimit' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpiringSubscriptionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/subscriptions/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Subscriptions]
      operationId: getSubscription
      summary: Detalle de una suscripción
      x-roles: [admin, operator]
      security:
        - bearerAuth: []
        - apiKeyAuth: ['subscriptions:read']
      responses:
        '200':
          description: Suscripción
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Subscriptions]
      operationId: updateSubscription
      summary: Actualiza campos no estructurales
      description: |
        No cambia estado ni fechas (usar acciones). `priceAmount` y `supplierCostAmount` sólo admin, con `changeReason`
        (afectan al periodo **vigente** y quedan auditados con antes/después; los periodos cerrados no cambian).
        Cambiar `isRenewable` revisa las alertas pendientes (RN-09, RN-10).
      x-roles: [admin, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionUpdate' }
      responses:
        '200':
          description: Suscripción actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/subscriptions/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Subscriptions]
      operationId: activateSubscription
      summary: pending_activation → active
      x-roles: [admin, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionInput' }
      responses:
        '200': { $ref: '#/components/responses/SubscriptionDetailOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/subscriptions/{id}/start-renewal:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Subscriptions]
      operationId: startSubscriptionRenewal
      summary: active → in_renewal y followUpStatus = in_progress
      x-roles: [admin, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionInput' }
      responses:
        '200': { $ref: '#/components/responses/SubscriptionDetailOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/subscriptions/{id}/renew:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Subscriptions]
      operationId: renewSubscription
      summary: Confirma la renovación y registra el nuevo periodo (§6.5, Flujo B)
      description: |
        Atómico: marca el periodo actual `renewed`, crea el periodo siguiente (por defecto empieza el día siguiente al fin
        actual y su fin se calcula con el ciclo), actualiza `currentPeriodEnd`, deja el estado `active`, cancela alertas del
        periodo anterior y programa las nuevas, cierra tareas abiertas de renovación, resuelve solicitudes abiertas y audita
        `subscription.renewed`. El nuevo periodo nace con `paymentStatus=pending` salvo que se indique `not_tracked` (RN-06).
      x-roles: [admin, operator]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenewInput' }
      responses:
        '200': { $ref: '#/components/responses/SubscriptionDetailOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/subscriptions/{id}/not-renewed:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Subscriptions]
      operationId: markSubscriptionNotRenewed
      summary: Registra la decisión de no renovar (motivo obligatorio)
      description: Si la suscripción sigue vigente, el estado cambia a `not_renewed` al terminar el periodo (job); si está `expired`, cambia inmediatamente. Cancela las alertas de renovación pendientes.
      x-roles: [admin, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionReasonInput' }
      responses:
        '200': { $ref: '#/components/responses/SubscriptionDetailOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/subscriptions/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Subscriptions]
      operationId: cancelSubscription
      summary: Cancela la suscripción (terminal, sólo admin)
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionReasonInput' }
      responses:
        '200': { $ref: '#/components/responses/SubscriptionDetailOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/subscriptions/{id}/correct-expiration:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Subscriptions]
      operationId: correctSubscriptionExpiration
      summary: Corrige la fecha de vencimiento del periodo vigente (Flujo E)
      description: Motivo obligatorio. Conserva el valor anterior en auditoría (`subscription.expiration_corrected`), recalcula alertas futuras y cancela las que no correspondan. No admite una fecha anterior al inicio del periodo vigente.
      x-roles: [admin, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectExpirationInput' }
      responses:
        '200': { $ref: '#/components/responses/SubscriptionDetailOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/subscriptions/{id}/periods:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Subscriptions]
      operationId: listSubscriptionPeriods
      summary: Historial de periodos (más reciente primero)
      x-roles: [admin, operator]
      security:
        - bearerAuth: []
        - apiKeyAuth: ['subscriptions:read']
      responses:
        '200':
          description: Periodos
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SubscriptionPeriod' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/subscriptions/{id}/periods/{periodId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: periodId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Subscriptions]
      operationId: updateSubscriptionPeriodPayment
      summary: Actualiza la dimensión de pago (y referencia contractual) de un periodo
      description: Única forma de cambiar `paymentStatus` (RN-06, RN-07). Auditado (`subscription_period.payment_updated`).
      x-roles: [admin, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeriodPaymentUpdate' }
      responses:
        '200':
          description: Periodo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionPeriod' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/subscriptions/{id}/notifications:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Subscriptions]
      operationId: listSubscriptionNotifications
      summary: Alertas de la suscripción (cualquier estado)
      x-roles: [admin, operator]
      responses:
        '200':
          description: Alertas
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/renewal-requests:
    get:
      tags: [RenewalRequests]
      operationId: listRenewalRequests
      summary: Lista solicitudes de renovación
      x-roles: [admin, operator]
      security:
        - bearerAuth: []
        - apiKeyAuth: ['renewal-requests:read']
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { type: string, examples: ['pending_review,in_progress'] }
        - name: clientId
          in: query
          schema: { type: string, format: uuid }
        - name: subscriptionId
          in: query
          schema: { type: string, format: uuid }
        - name: assignedUserId
          in: query
          schema: { type: string, format: uuid }
        - name: sort
          in: query
          schema: { type: string, enum: [createdAt, -createdAt], default: -createdAt }
      responses:
        '200':
          description: Página de solicitudes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenewalRequestPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [RenewalRequests]
      operationId: createRenewalRequest
      summary: Registra una solicitud de renovación (integración o equipo interno)
      description: |
        Crea la solicitud en `pending_review` (no es una renovación confirmada, RN-05). El worker crea la tarea
        `review_renewal_request` y notifica al equipo. `Idempotency-Key` obligatoria para integraciones.
        Los usuarios cliente usan `POST /api/v1/portal/renewal-requests`.
      x-roles: [admin, operator]
      security:
        - bearerAuth: []
        - apiKeyAuth: ['renewal-requests:write']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenewalRequestCreate' }
      responses:
        '201':
          description: Solicitud creada
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenewalRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/renewal-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [RenewalRequests]
      operationId: getRenewalRequest
      summary: Detalle de solicitud
      x-roles: [admin, operator]
      security:
        - bearerAuth: []
        - apiKeyAuth: ['renewal-requests:read']
      responses:
        '200':
          description: Solicitud
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenewalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [RenewalRequests]
      operationId: updateRenewalRequest
      summary: Asigna responsable o pasa a `in_progress`
      x-roles: [admin, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenewalRequestUpdate' }
      responses:
        '200':
          description: Solicitud actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenewalRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/renewal-requests/{id}/resolve:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [RenewalRequests]
      operationId: resolveRenewalRequest
      summary: Resuelve la solicitud (renewed | not_renewed | other)
      description: Resolver como `renewed` exige un periodo renovado confirmado posterior a la solicitud (usar antes `/subscriptions/{id}/renew`; si no, `422 renewal_not_confirmed`). La solicitud nunca renueva por sí misma (RN-05).
      x-roles: [admin, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenewalRequestResolve' }
      responses:
        '200':
          description: Solicitud resuelta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenewalRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/renewal-tasks:
    get:
      tags: [RenewalTasks]
      operationId: listRenewalTasks
      summary: Lista tareas de seguimiento con filtros (§6.6)
      x-roles: [admin, operator]
      security:
        - bearerAuth: []
        - apiKeyAuth: ['renewal-tasks:read']
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: assigneeUserId
          in: query
          description: UUID o `me`
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, examples: ['pending,in_progress'] }
        - name: priority
          in: query
          schema: { type: string, examples: ['high,urgent'] }
        - name: taskType
          in: query
          schema: { $ref: '#/components/schemas/TaskType' }
        - name: clientId
          in: query
          schema: { type: string, format: uuid }
        - name: subscriptionId
          in: query
          schema: { type: string, format: uuid }
        - name: dueFrom
          in: query
          schema: { type: string, format: date }
        - name: dueTo
          in: query
          schema: { type: string, format: date }
        - name: overdue
          in: query
          description: '`true` = abiertas con dueDate < hoy (Bogotá)'
          schema: { type: boolean }
        - name: sort
          in: query
          schema: { type: string, enum: [dueDate, -dueDate, priority, -priority, createdAt, -createdAt], default: dueDate }
      responses:
        '200':
          description: Página de tareas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [RenewalTasks]
      operationId: createRenewalTask
      summary: Crea una tarea manual
      x-roles: [admin, operator]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
