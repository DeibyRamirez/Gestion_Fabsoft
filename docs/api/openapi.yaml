openapi: 3.1.0
info:
  title: FabSoft API
  version: 1.0.0
  summary: API REST v1 de la plataforma de gestión de clientes, licencias/suscripciones y renovaciones.
  description: |
    API versionada bajo `/api/v1`. Fuente de verdad del contrato; los esquemas se generan/contrastan
    desde Zod (`@fabsoft/shared`) con `@asteasolutions/zod-to-openapi` (ver `docs/stack.md`).

    ## Autenticación
    - **Humanos** (`admin`, `operator`, `client`): `Authorization: Bearer <JWT>` (EdDSA, 15 min).
      El refresh token viaja en la cookie `fs_rt` (HttpOnly, Secure, SameSite=Strict, Path=/api/v1/auth). Ver ADR-001.
    - **Integraciones**: cabecera `X-Api-Key: fsk_live_xxxxxxxx_...`. Permisos por *scope*. Enviar ambas credenciales → `400 ambiguous_credentials`.
    - La extensión `x-roles` de cada operación indica los roles humanos permitidos. En los requisitos
      `apiKeyAuth` se listan los *scopes* necesarios (OpenAPI 3.1 permite nombres de rol en esquemas no OAuth).

    ## Scopes de integración
    `clients:read`, `products:read`, `subscriptions:read`, `renewal-tasks:read`, `renewal-requests:read`, `renewal-requests:write`.
    Además del scope, el alcance de datos se limita por `client_scope` del manifest (`all` | `own`).

    ## Convenciones
    - JSON `camelCase`. Fechas de negocio `YYYY-MM-DD` (America/Bogota, fin de periodo **inclusivo**). Instantes ISO-8601 UTC.
    - Importes como string decimal con 2 decimales y `currency: "COP"`.
    - Paginación: `page` (≥1) y `pageSize` (1–100, por defecto 20). Respuesta `{ data, meta }`.
    - Ordenación: `sort=campo` (asc) o `sort=-campo` (desc) sobre la lista blanca de cada operación.
    - Filtros multivalor separados por comas (`status=active,in_renewal`).
    - Errores: RFC 9457 `application/problem+json` con `code` estable y `requestId`.
    - Idempotencia: cabecera `Idempotency-Key` (8–255 caracteres) en POST de escritura. Misma clave + mismo cuerpo
      durante 24 h → se devuelve la respuesta original (cabecera `Idempotency-Replayed: true`); misma clave con cuerpo distinto → `422 idempotency_key_reused`;
      petición original aún en curso → `409 idempotency_in_progress`. **Obligatoria** para integraciones en `POST /renewal-requests`.
    - Bloqueo optimista: campo `version` en el cuerpo de PATCH/acciones de suscripciones y tareas → `409 version_conflict`.
    - Límites de consumo: cabeceras `RateLimit` y `RateLimit-Policy` (draft IETF); exceso → `429` con `Retry-After`.
    - Cada respuesta incluye `X-Request-Id` (se respeta el recibido si es un UUID válido).
  contact:
    name: Equipo FabSoft
  license:
    name: Propietario — uso interno FabSoft
    identifier: LicenseRef-FabSoft-Proprietary
servers:
  - url: http://localhost:4000
    description: Desarrollo local
  - url: https://api.fabsoft.example
    description: Producción (dominio a definir)
tags:
  - name: Auth
    description: Sesión de usuarios humanos
  - name: Users
    description: Usuarios internos y de portal
  - name: Clients
    description: Clientes, contactos y notas
  - name: Products
    description: Catálogo
  - name: Subscriptions
    description: Licencias/suscripciones, periodos y transiciones
  - name: RenewalRequests
    description: Solicitudes de renovación
  - name: RenewalTasks
    description: Tareas de seguimiento (tabla tasks)
  - name: Notifications
    description: Alertas in-app y registro de envíos
  - name: AlertRules
    description: Política de alertas
  - name: Dashboard
    description: Indicadores operativos
  - name: Portal
    description: Vistas restringidas para usuarios cliente
  - name: Integrations
    description: Integraciones y credenciales API
  - name: Audit
    description: Auditoría
  - name: Settings
    description: Configuración general
  - name: Health
    description: Salud del servicio
security:
  - bearerAuth: []

paths:
  /api/v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness del proceso API
      security: []
      responses:
        '200':
          description: Proceso vivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Readiness (conexión a BD y migraciones al día)
      security: []
      responses:
        '200':
          description: Listo para recibir tráfico
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Inicia sesión con email y contraseña
      description: 'Límite: 5 intentos/min por IP+email y 20/min por IP. Respuesta idéntica para email inexistente o contraseña errónea.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Sesión iniciada. Fija la cookie `fs_rt`.
          headers:
            Set-Cookie:
              description: '`fs_rt=<refresh>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=1209600`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rota el refresh token y emite un nuevo access token
      description: Reutilizar un refresh ya rotado revoca toda la familia de sesión (`reuse_detected`). Exige la cabecera `X-Requested-With` (defensa CSRF adicional a SameSite=Strict).
      security:
        - refreshCookie: []
      parameters:
        - name: X-Requested-With
          in: header
          required: true
          schema: { type: string, const: fabsoft-web }
      responses:
        '200':
          description: Nuevo access token y nueva cookie `fs_rt`
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Cierra la sesión (revoca la familia del refresh token)
      security:
        - refreshCookie: []
      responses:
        '204':
          description: Sesión cerrada; cookie eliminada
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Usuario autenticado
      x-roles: [admin, operator, client]
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Cambia la contraseña propia (revoca las demás sesiones)
      x-roles: [admin, operator, client]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordInput' }
      responses:
        '204':
          description: Contraseña cambiada
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Lista usuarios (internos y de portal)
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - name: role
          in: query
          description: Filtro multivalor por `UserRole`
          schema: { type: string, examples: ['admin,operator'] }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/UserStatus' }
        - name: clientId
          in: query
          schema: { type: string, format: uuid }
        - name: sort
          in: query
          schema: { type: string, enum: [fullName, -fullName, createdAt, -createdAt], default: fullName }
      responses:
        '200':
          description: Página de usuarios
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      operationId: createUser
      summary: Crea un usuario interno o de portal
      description: Devuelve una contraseña temporal **una sola vez**; el usuario debe cambiarla en el primer acceso. Auditado (`user.created`).
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Users]
      operationId: getUser
      summary: Detalle de usuario
      x-roles: [admin]
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Cambia nombre, rol, cliente o estado (desactivar revoca sesiones)
      description: Auditado (`user.updated`, `user.role_changed`, `user.disabled`). Un admin no puede desactivarse ni quitarse el rol a sí mismo.
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/users/{id}/reset-password:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Users]
      operationId: resetUserPassword
      summary: Genera una contraseña temporal y revoca las sesiones del usuario
      x-roles: [admin]
      responses:
        '200':
          description: Contraseña temporal (se muestra una sola vez)
          content:
            application/json:
              schema:
                type: object
                required: [temporaryPassword]
                properties:
                  temporaryPassword: { type: string, minLength: 16 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/clients:
    get:
      tags: [Clients]
      operationId: listClients
      summary: Lista clientes dentro del alcance autorizado
      x-roles: [admin, operator]
      security:
        - bearerAuth: []
        - apiKeyAuth: ['clients:read']
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - name: status
          in: query
          description: 'Multivalor `ClientStatus`. Por defecto `active,inactive`.'
          schema: { type: string, examples: ['active,inactive'] }
        - name: taxId
          in: query
          description: Búsqueda exacta por identificación (normalizada) para evitar duplicados.
          schema: { type: string }
        - name: ownerUserId
          in: query
          schema: { type: string, format: uuid }
        - name: sort
          in: query
          schema: { type: string, enum: [legalName, -legalName, createdAt, -createdAt], default: legalName }
      responses:
        '200':
          description: Página de clientes
          headers:
            RateLimit: { $ref: '#/components/headers/RateLimit' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Clients]
      operationId: createClient
      summary: Crea un cliente (Flujo A)
      description: Rechaza identificaciones fiscales duplicadas (`409 client_tax_id_taken`). Auditado (`client.created`).
      x-roles: [admin, operator]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientCreate' }
      responses:
        '201':
          description: Cliente creado
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/clients/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Clients]
      operationId: getClient
      summary: Detalle de un cliente autorizado (con contactos y resumen)
      description: Las integraciones reciben el cliente sin `summary`. Cliente fuera de alcance → `404` (no se revela su existencia).
      x-roles: [admin, operator]
      security:
        - bearerAuth: []
        - apiKeyAuth: ['clients:read']
      responses:
        '200':
          description: Cliente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Clients]
      operationId: updateClient
      summary: Actualiza datos del cliente
      description: Auditado (`client.updated`) con antes/después. `status` sólo admite `active`/`inactive`; archivar usa `/archive`.
      x-roles: [admin, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientUpdate' }
      responses:
        '200':
          description: Cliente actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/clients/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Clients]
      operationId: archiveClient
      summary: Archiva un cliente (sin borrar historial)
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200':
          description: Cliente archivado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/clients/{id}/reactivate:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Clients]
      operationId: reactivateClient
      summary: Reactiva un cliente archivado o inactivo
      x-roles: [admin]
      responses:
        '200':
          description: Cliente activo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/clients/{id}/contacts:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Clients]
      operationId: listClientContacts
      summary: Contactos del cliente
      x-roles: [admin, operator]
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Contactos
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ClientContact' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Clients]
      operationId: createClientContact
      summary: Añade un contacto (marcar `isPrimary` desmarca el anterior)
      x-roles: [admin, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientContactCreate' }
      responses:
        '201':
          description: Contacto creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientContact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/clients/{id}/contacts/{contactId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: contactId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Clients]
      operationId: updateClientContact
      summary: Actualiza o archiva (`archived=true`) un contacto
      x-roles: [admin, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientContactUpdate' }
      responses:
        '200':
          description: Contacto actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientContact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/clients/{id}/notes:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Clients]
      operationId: listClientNotes
      summary: Notas internas de seguimiento (más recientes primero)
      x-roles: [admin, operator]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de notas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientNotePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Clients]
      operationId: createClientNote
      summary: Añade una nota interna (inmutable)
      x-roles: [admin, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties:
                body: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '201':
          description: Nota creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientNote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/clients/{id}/activity:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Clients]
      operationId: listClientActivity
      summary: Historial relacionado con el cliente (auditoría filtrada por cliente)
      x-roles: [admin, operator]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de eventos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: Catálogo de productos y servicios
      x-roles: [admin, operator]
      security:
        - bearerAuth: []
        - apiKeyAuth: ['products:read']
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - name: productType
          in: query
          schema: { type: string, examples: ['third_party,own'] }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProductStatus' }
        - name: sort
          in: query
          schema: { type: string, enum: [name, -name, createdAt, -createdAt], default: name }
      responses:
        '200':
          description: Página de productos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Products]
      operationId: createProduct
      summary: Crea un producto del catálogo
      x-roles: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Products]
      operationId: getProduct
