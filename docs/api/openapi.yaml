components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token EdDSA de 15 minutos para usuarios humanos.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: API key de integración (`fsk_live_<prefijo>_<secreto>`). Los scopes requeridos se listan en cada operación.
    refreshCookie:
      type: apiKey
      in: cookie
      name: fs_rt
      description: Refresh token opaco rotativo (HttpOnly).

  headers:
    RateLimit:
      description: 'Cuota según el draft IETF RateLimit (p. ej. `limit=60, remaining=59, reset=42`).'
      schema: { type: string }

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Q:
      name: q
      in: query
      description: Búsqueda de texto (contiene, sin distinguir mayúsculas)
      schema: { type: string, minLength: 2, maxLength: 100 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Clave única por intento lógico (UUID recomendado). Retención 24 h. Obligatoria para integraciones en POST.
      schema: { type: string, minLength: 8, maxLength: 255 }

  responses:
    BadRequest:
      description: Petición inválida (`validation_error`, `ambiguous_credentials`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://docs.fabsoft.example/errors/validation_error
            title: La petición no es válida
            status: 400
            code: validation_error
            detail: Hay campos con errores.
            requestId: 6f1c2b8e-0d1e-4a7b-9c55-3a2f1e0d9b11
            errors:
              - path: currentPeriodEnd
                message: Debe ser igual o posterior a startDate
    Unauthorized:
      description: Sin credenciales válidas (`unauthenticated`, `invalid_credentials`, `token_expired`, `password_change_required`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Autenticado sin permiso (`forbidden`, `insufficient_scope`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No existe o está fuera del alcance del actor (`not_found`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflicto (`version_conflict`, `client_tax_id_taken`, `primary_contact_conflict`, `duplicate_email`, `duplicate_product`, `idempotency_in_progress`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: Regla de negocio incumplida (`invalid_state_transition`, `period_overlap`, `client_archived`, `client_inactive`, `product_inactive`, `idempotency_key_reused`, `notification_obsolete`, `credential_limit_reached`, `manifest_invalid`, `renewal_not_confirmed`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Límite de consumo superado (`rate_limited`)
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: No disponible (`maintenance`, `dependency_unavailable`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SubscriptionDetailOk:
      description: Suscripción tras la operación
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SubscriptionDetail' }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum: [validation_error, ambiguous_credentials, unauthenticated, invalid_credentials, token_expired,
                 password_change_required, forbidden, insufficient_scope, not_found, version_conflict,
                 client_tax_id_taken, primary_contact_conflict, duplicate_email, duplicate_product, idempotency_in_progress,
                 idempotency_key_reused, invalid_state_transition, period_overlap, client_archived, client_inactive,
                 product_inactive, notification_obsolete, credential_limit_reached, manifest_invalid,
                 renewal_not_confirmed, rate_limited, maintenance, dependency_unavailable, internal_error]
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    Amount:
      type: string
      pattern: '^\d{1,12}\.\d{2}$'
      description: Importe decimal en pesos colombianos con 2 decimales
      examples: ['1200000.00']
    Currency:
      type: string
      const: COP
    UserRef:
      type: object
      required: [id, fullName]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
    ReasonInput:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000 }
    VersionInput:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
    VersionReasonInput:
      type: object
      required: [version, reason]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        version: { type: string }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, fail] }

    UserRole: { type: string, enum: [admin, operator, client] }
    UserStatus: { type: string, enum: [active, disabled] }
    ClientStatus: { type: string, enum: [active, inactive, archived] }
    ProductType: { type: string, enum: [third_party, own, recurring_service] }
    ProductStatus: { type: string, enum: [active, inactive] }
    BillingCycle: { type: string, enum: [monthly, quarterly, semiannual, annual, biennial, custom] }
    SubscriptionStatus: { type: string, enum: [pending_activation, active, in_renewal, expired, cancelled, not_renewed] }
    PaymentStatus: { type: string, enum: [not_tracked, pending, received] }
    FollowUpStatus: { type: string, enum: [none, in_progress, awaiting_client, closed] }
    RenewalOutcome: { type: string, enum: [pending, renewed, not_renewed] }
    RenewalRequestStatus: { type: string, enum: [pending_review, in_progress, resolved] }
    RenewalRequestResolution: { type: string, enum: [renewed, not_renewed, other] }
    TaskType: { type: string, enum: [contact_client, send_proposal, confirm_terms, verify_payment, confirm_renewal, record_non_renewal, review_renewal_request, review_expired, other] }
    TaskPriority: { type: string, enum: [low, medium, high, urgent] }
    TaskStatus: { type: string, enum: [pending, in_progress, completed, cancelled] }
    NotificationType: { type: string, enum: [expiration_alert, renewal_request_created] }
    NotificationChannel: { type: string, enum: [in_app, email] }
    NotificationStatus: { type: string, enum: [pending, sent, failed, cancelled] }
    IntegrationStatus: { type: string, enum: [active, disabled] }
    ClientScope: { type: string, enum: [all, own] }
    ActorType: { type: string, enum: [user, integration, system] }
    Scope: { type: string, enum: ['clients:read', 'products:read', 'subscriptions:read', 'renewal-tasks:read', 'renewal-requests:read', 'renewal-requests:write'] }

    LoginInput:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 256 }
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Segundos de validez, examples: [900] }
        user: { $ref: '#/components/schemas/Me' }
    Me:
      type: object
      required: [id, email, fullName, role, mustChangePassword]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        clientId: { type: [string, 'null'], format: uuid }
        mustChangePassword: { type: boolean }
    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword: { type: string, maxLength: 256 }
        newPassword: { type: string, minLength: 12, maxLength: 256, description: Mínimo 12 caracteres; se rechaza si coincide con el email. }
    User:
      type: object
      required: [id, email, fullName, role, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        clientId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/UserStatus' }
        mustChangePassword: { type: boolean }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserCreate:
      type: object
      required: [email, fullName, role]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        fullName: { type: string, minLength: 2, maxLength: 150 }
        role: { $ref: '#/components/schemas/UserRole' }
        clientId: { type: [string, 'null'], format: uuid, description: Obligatorio si role=client; prohibido en otro caso. }
    UserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 2, maxLength: 150 }
        role: { $ref: '#/components/schemas/UserRole' }
        clientId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/UserStatus' }
    UserCreated:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [temporaryPassword]
          properties:
            temporaryPassword: { type: string, minLength: 16 }
    UserPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/User' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Client:
      type: object
      required: [id, legalName, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        legalName: { type: string }
        taxId: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ClientStatus' }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        owner:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClientDetail:
      allOf:
        - $ref: '#/components/schemas/Client'
        - type: object
          properties:
            contacts:
              type: array
              items: { $ref: '#/components/schemas/ClientContact' }
            summary:
              type: object
              description: Sólo para usuarios internos
              properties:
                activeSubscriptions: { type: integer }
                expiringIn30Days: { type: integer }
                expiredSubscriptions: { type: integer }
                openTasks: { type: integer }
                openRenewalRequests: { type: integer }
    ClientCreate:
      type: object
      required: [legalName]
      additionalProperties: false
      properties:
        legalName: { type: string, minLength: 2, maxLength: 200 }
        taxId: { type: [string, 'null'], minLength: 3, maxLength: 30 }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 30 }
        ownerUserId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [active, inactive], default: active }
    ClientUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        legalName: { type: string, minLength: 2, maxLength: 200 }
        taxId: { type: [string, 'null'], minLength: 3, maxLength: 30 }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 30 }
        ownerUserId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [active, inactive] }
    ClientPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Client' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    ClientContact:
      type: object
      required: [id, clientId, fullName, isPrimary]
      properties:
        id: { type: string, format: uuid }
        clientId: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        roleTitle: { type: [string, 'null'] }
        isPrimary: { type: boolean }
        archivedAt: { type: [string, 'null'], format: date-time }
    ClientContactCreate:
      type: object
      required: [fullName]
      additionalProperties: false
      description: Requiere email o teléfono.
      properties:
        fullName: { type: string, minLength: 2, maxLength: 150 }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 30 }
        roleTitle: { type: [string, 'null'], maxLength: 100 }
        isPrimary: { type: boolean, default: false }
    ClientContactUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 2, maxLength: 150 }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 30 }
        roleTitle: { type: [string, 'null'], maxLength: 100 }
        isPrimary: { type: boolean }
        archived: { type: boolean }
    ClientNote:
      type: object
      required: [id, clientId, author, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        clientId: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/UserRef' }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    ClientNotePage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ClientNote' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Product:
      type: object
      additionalProperties: false
      required: [id, name, productType, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        productType: { $ref: '#/components/schemas/ProductType' }
        vendor: { type: [string, 'null'] }
        referenceCode: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ProductStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductCreate:
      type: object
      required: [name, productType]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 150 }
        description: { type: [string, 'null'], maxLength: 2000 }
        productType: { $ref: '#/components/schemas/ProductType' }
        vendor: { type: [string, 'null'], maxLength: 150 }
        referenceCode: { type: [string, 'null'], maxLength: 100 }
    ProductUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 150 }
        description: { type: [string, 'null'], maxLength: 2000 }
        productType: { $ref: '#/components/schemas/ProductType' }
        vendor: { type: [string, 'null'], maxLength: 150 }
        referenceCode: { type: [string, 'null'], maxLength: 100 }
        status: { $ref: '#/components/schemas/ProductStatus' }
    ProductPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Product' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Subscription:
      type: object
      description: Vista de listado. `supplierCostAmount` y `notes` nunca se envían a integraciones.
      required: [id, client, product, startDate, currentPeriodEnd, billingCycle, priceAmount, currency, status, followUpStatus, isRenewable, version]
      properties:
        id: { type: string, format: uuid }
        client:
          type: object
          required: [id, legalName]
          properties:
            id: { type: string, format: uuid }
            legalName: { type: string }
        product:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        contractReference: { type: [string, 'null'] }
        startDate: { type: string, format: date }
        currentPeriodEnd: { type: string, format: date, description: Último día inclusivo de vigencia (America/Bogota) }
        daysUntilExpiration: { type: integer, description: Negativo si ya venció }
        billingCycle: { $ref: '#/components/schemas/BillingCycle' }
        customCycleMonths: { type: [integer, 'null'], minimum: 1, maximum: 120 }
        priceAmount: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        followUpStatus: { $ref: '#/components/schemas/FollowUpStatus' }
        currentPaymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        isRenewable: { type: boolean }
        owner:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        version: { type: integer }
    SubscriptionDetail:
      allOf:
        - $ref: '#/components/schemas/Subscription'
        - type: object
          properties:
            supplierCostAmount:
              oneOf:
                - $ref: '#/components/schemas/Amount'
                - type: 'null'
            renewalTerms: { type: [string, 'null'] }
            visibleInPortal: { type: boolean }
            notes: { type: [string, 'null'] }
            currentPeriod: { $ref: '#/components/schemas/SubscriptionPeriod' }
            cancelledAt: { type: [string, 'null'], format: date-time }
            cancellationReason: { type: [string, 'null'] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    SubscriptionCreate:
      type: object
      required: [clientId, productId, startDate, currentPeriodEnd, billingCycle, priceAmount]
      additionalProperties: false
      properties:
        clientId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        contractReference: { type: [string, 'null'], maxLength: 120 }
        startDate: { type: string, format: date }
        currentPeriodEnd: { type: string, format: date, description: 'Debe ser >= startDate' }
        billingCycle: { $ref: '#/components/schemas/BillingCycle' }
        customCycleMonths: { type: [integer, 'null'], minimum: 1, maximum: 120, description: Obligatorio si billingCycle=custom }
        priceAmount: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        supplierCostAmount:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        renewalTerms: { type: [string, 'null'], maxLength: 2000 }
        isRenewable: { type: boolean, default: true }
        visibleInPortal: { type: boolean, default: true }
        ownerUserId: { type: [string, 'null'], format: uuid }
        notes: { type: [string, 'null'], maxLength: 5000 }
        activate: { type: boolean, default: false, description: 'true ⇒ nace `active`; false ⇒ `pending_activation`' }
        initialPaymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
    SubscriptionUpdate:
      type: object
      required: [version]
      additionalProperties: false
      minProperties: 2
      properties:
        version: { type: integer, minimum: 1 }
        contractReference: { type: [string, 'null'], maxLength: 120 }
        renewalTerms: { type: [string, 'null'], maxLength: 2000 }
        isRenewable: { type: boolean }
        visibleInPortal: { type: boolean }
        ownerUserId: { type: [string, 'null'], format: uuid }
        notes: { type: [string, 'null'], maxLength: 5000 }
        followUpStatus: { type: string, enum: [in_progress, awaiting_client] }
        priceAmount: { $ref: '#/components/schemas/Amount' }
        supplierCostAmount:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        changeReason: { type: string, minLength: 3, maxLength: 1000, description: Obligatorio si cambia precio o costo }
    SubscriptionPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Subscription' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    ExpiringSubscriptionPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Subscription' } }
        meta:
          allOf:
            - $ref: '#/components/schemas/PaginationMeta'
            - type: object
              required: [today, withinDays]
              properties:
                today: { type: string, format: date }
                withinDays: { type: integer }
    SubscriptionPeriod:
      type: object
      required: [id, periodNumber, startDate, endDate, billingCycle, priceAmount, currency, renewalOutcome, paymentStatus]
      properties:
        id: { type: string, format: uuid }
        periodNumber: { type: integer, minimum: 1 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        billingCycle: { $ref: '#/components/schemas/BillingCycle' }
        priceAmount: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        renewalOutcome: { $ref: '#/components/schemas/RenewalOutcome' }
        outcomeReason: { type: [string, 'null'] }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        confirmedAt: { type: [string, 'null'], format: date-time }
        confirmedBy:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        contractReference: { type: [string, 'null'] }
    RenewInput:
      type: object
      required: [version, newPeriod]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        newPeriod:
          type: object
          additionalProperties: false
          required: [priceAmount]
          properties:
            startDate: { type: string, format: date, description: 'Por defecto currentPeriodEnd + 1 día; no puede solapar' }
            endDate: { type: string, format: date, description: Por defecto calculado con billingCycle }
            billingCycle: { $ref: '#/components/schemas/BillingCycle' }
            customCycleMonths: { type: [integer, 'null'], minimum: 1, maximum: 120 }
            priceAmount: { $ref: '#/components/schemas/Amount' }
            supplierCostAmount:
              oneOf:
                - $ref: '#/components/schemas/Amount'
                - type: 'null'
            contractReference: { type: [string, 'null'], maxLength: 120 }
            paymentStatus: { type: string, enum: [pending, not_tracked], default: pending }
        note: { type: [string, 'null'], maxLength: 1000 }
    CorrectExpirationInput:
      type: object
      required: [version, newCurrentPeriodEnd, reason]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        newCurrentPeriodEnd: { type: string, format: date }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    PeriodPaymentUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        contractReference: { type: [string, 'null'], maxLength: 120 }

    RenewalRequestCreate:
      type: object
      required: [subscriptionId]
      additionalProperties: false
      properties:
        subscriptionId: { type: string, format: uuid }
        comment: { type: [string, 'null'], maxLength: 2000, description: Qué desea el cliente }
    RenewalRequestUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: { type: string, enum: [in_progress] }
        assignedUserId: { type: [string, 'null'], format: uuid }
    RenewalRequestResolve:
      type: object
      required: [resolution]
      additionalProperties: false
      properties:
        resolution: { $ref: '#/components/schemas/RenewalRequestResolution' }
        resolutionNote: { type: [string, 'null'], maxLength: 2000 }
    RenewalRequest:
      type: object
      required: [id, subscriptionId, clientId, status, requestedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        subscriptionId: { type: string, format: uuid }
        clientId: { type: string, format: uuid }
        requestedBy:
          type: object
          required: [actorType, id]
          properties:
            actorType: { type: string, enum: [user, integration] }
            id: { type: string, format: uuid }
            name: { type: string }
        comment: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/RenewalRequestStatus' }
        assignedUser:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        resolution:
          oneOf:
            - $ref: '#/components/schemas/RenewalRequestResolution'
            - type: 'null'
        resolutionNote: { type: [string, 'null'] }
        resolvedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RenewalRequestPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/RenewalRequest' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Task:
      type: object
      required: [id, taskType, clientId, priority, dueDate, status, title, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        taskType: { $ref: '#/components/schemas/TaskType' }
        title: { type: string }
        clientId: { type: string, format: uuid }
        subscriptionId: { type: [string, 'null'], format: uuid }
        renewalRequestId: { type: [string, 'null'], format: uuid }
        assignee:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        priority: { $ref: '#/components/schemas/TaskPriority' }
        dueDate: { type: string, format: date }
        isOverdue: { type: boolean }
        status: { $ref: '#/components/schemas/TaskStatus' }
        notes: { type: [string, 'null'] }
        nextAction: { type: [string, 'null'] }
        outcome: { type: [string, 'null'] }
        completedAt: { type: [string, 'null'], format: date-time }
        origin: { type: string, enum: [manual, alert_rule, renewal_request] }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskCreate:
      type: object
      required: [taskType, clientId, dueDate, title]
      additionalProperties: false
      properties:
        taskType: { $ref: '#/components/schemas/TaskType' }
        title: { type: string, minLength: 2, maxLength: 200 }
        clientId: { type: string, format: uuid }
        subscriptionId: { type: [string, 'null'], format: uuid }
        assigneeUserId: { type: [string, 'null'], format: uuid }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        dueDate: { type: string, format: date }
        notes: { type: [string, 'null'], maxLength: 5000 }
        nextAction: { type: [string, 'null'], maxLength: 500 }
    TaskUpdate:
      type: object
      required: [version]
      additionalProperties: false
      minProperties: 2
      properties:
        version: { type: integer, minimum: 1 }
        title: { type: string, minLength: 2, maxLength: 200 }
        assigneeUserId: { type: [string, 'null'], format: uuid }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        dueDate: { type: string, format: date }
        status: { type: string, enum: [pending, in_progress] }
        notes: { type: [string, 'null'], maxLength: 5000 }
        nextAction: { type: [string, 'null'], maxLength: 500 }
    TaskClose:
      type: object
      required: [version, outcome]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        outcome: { type: string, minLength: 2, maxLength: 2000 }
    TaskPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Task' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Notification:
      type: object
      required: [id, notificationType, channel, recipient, scheduledFor, status, attempts]
      properties:
        id: { type: string, format: uuid }
        notificationType: { $ref: '#/components/schemas/NotificationType' }
        subscriptionId: { type: [string, 'null'], format: uuid }
        renewalRequestId: { type: [string, 'null'], format: uuid }
        taskId: { type: [string, 'null'], format: uuid }
        ruleCode: { type: [string, 'null'], examples: [D30] }
        periodEnd: { type: [string, 'null'], format: date }
        channel: { $ref: '#/components/schemas/NotificationChannel' }
        recipient: { $ref: '#/components/schemas/UserRef' }
        scheduledFor: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/NotificationStatus' }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        nextAttemptAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }
        sentAt: { type: [string, 'null'], format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
        cancelReason: { type: [string, 'null'] }
        title: { type: string, description: Texto in-app ya renderizado }
    NotificationPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        meta:
          allOf:
            - $ref: '#/components/schemas/PaginationMeta'
            - type: object
              properties:
                unreadCount: { type: integer }
    AlertRule:
      type: object
      required: [id, code, description, offsetDays, channels, createsTask, appliesWhenNotRenewable, isActive]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: [D30] }
        description: { type: string }
        offsetDays: { type: integer, minimum: -90, maximum: 365, description: '>0 antes, 0 el día, <0 después del vencimiento' }
        channels:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/NotificationChannel' }
        createsTask: { type: boolean }
        taskType:
          oneOf:
            - $ref: '#/components/schemas/TaskType'
            - type: 'null'
        taskPriority:
          oneOf:
            - $ref: '#/components/schemas/TaskPriority'
            - type: 'null'
        appliesWhenNotRenewable: { type: boolean }
        isActive: { type: boolean }
    AlertRuleUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        description: { type: string, minLength: 3, maxLength: 200 }
        offsetDays: { type: integer, minimum: -90, maximum: 365 }
        channels:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/NotificationChannel' }
        createsTask: { type: boolean }
        taskType:
          oneOf:
            - $ref: '#/components/schemas/TaskType'
            - type: 'null'
        taskPriority:
          oneOf:
            - $ref: '#/components/schemas/TaskPriority'
            - type: 'null'
        appliesWhenNotRenewable: { type: boolean }
        isActive: { type: boolean }

    DashboardIndicator:
      type: object
      required: [count, resource, filter]
      properties:
        count: { type: integer, minimum: 0 }
        resource: { type: string, enum: [subscriptions, renewal-tasks, renewal-requests] }
        filter:
          type: object
          additionalProperties: { type: string }
          description: Parámetros de query del listado que compone la cifra
          examples:
            - status: active,in_renewal
              expiresFrom: '2026-11-01'
              expiresTo: '2026-11-08'
    DashboardSummary:
      type: object
      required: [today, activeSubscriptions, expiringIn30Days, expiringIn15Days, expiringIn7Days, expiredSubscriptions, renewalsPendingResponse, overdueTasks, upcomingTasks, newRenewalRequests]
      properties:
        today: { type: string, format: date }
        activeSubscriptions: { $ref: '#/components/schemas/DashboardIndicator' }
        expiringIn30Days: { $ref: '#/components/schemas/DashboardIndicator' }
        expiringIn15Days: { $ref: '#/components/schemas/DashboardIndicator' }
        expiringIn7Days: { $ref: '#/components/schemas/DashboardIndicator' }
        expiredSubscriptions: { $ref: '#/components/schemas/DashboardIndicator' }
        renewalsPendingResponse: { $ref: '#/components/schemas/DashboardIndicator' }
        overdueTasks: { $ref: '#/components/schemas/DashboardIndicator' }
        upcomingTasks: { $ref: '#/components/schemas/DashboardIndicator' }
        newRenewalRequests: { $ref: '#/components/schemas/DashboardIndicator' }

    PortalMe:
      type: object
      required: [user, organization, contactChannel]
      properties:
        user: { $ref: '#/components/schemas/Me' }
        organization:
          type: object
          required: [id, legalName]
          properties:
            id: { type: string, format: uuid }
            legalName: { type: string }
            taxId: { type: [string, 'null'] }
        contactChannel:
          type: object
          properties:
            email: { type: [string, 'null'], format: email }
            phone: { type: [string, 'null'] }
            hours: { type: [string, 'null'] }
    PortalSubscription:
      type: object
      description: Sin costo de proveedor, notas internas, responsable ni estado de pago.
      required: [id, productName, startDate, currentPeriodEnd, billingCycle, priceAmount, currency, status]
      properties:
        id: { type: string, format: uuid }
        productName: { type: string }
        contractReference: { type: [string, 'null'] }
        startDate: { type: string, format: date }
        currentPeriodEnd: { type: string, format: date }
        daysUntilExpiration: { type: integer }
        billingCycle: { $ref: '#/components/schemas/BillingCycle' }
        priceAmount: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        renewalTerms: { type: [string, 'null'] }
        hasOpenRenewalRequest: { type: boolean }
    PortalSubscriptionPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/PortalSubscription' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    PortalPeriod:
      type: object
      required: [periodNumber, startDate, endDate, billingCycle, priceAmount, currency, renewalOutcome]
      properties:
        periodNumber: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        billingCycle: { $ref: '#/components/schemas/BillingCycle' }
        priceAmount: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        renewalOutcome: { $ref: '#/components/schemas/RenewalOutcome' }
    PortalRenewalRequest:
      type: object
      required: [id, subscriptionId, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        subscriptionId: { type: string, format: uuid }
        productName: { type: string }
        comment: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/RenewalRequestStatus' }
        resolution:
          oneOf:
            - $ref: '#/components/schemas/RenewalRequestResolution'
            - type: 'null'
        resolutionNote: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
    PortalRenewalRequestPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/PortalRenewalRequest' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    IntegrationManifest:
      type: object
      description: 'Manifest versionado (claves snake_case, documento propio). Ver docs/integrations/README.md.'
      required: [manifest_schema_version, integration, version, display_name, scopes, client_scope]
      additionalProperties: false
      properties:
        $schema: { type: string, description: Ruta informativa al JSON Schema del manifest }
        manifest_schema_version: { type: integer, const: 1 }
        integration: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
        version: { type: string, pattern: '^\d+\.\d+\.\d+$' }
        display_name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        owner:
          type: object
          additionalProperties: false
          properties:
            team: { type: string, maxLength: 120 }
            contact_email: { type: string, format: email }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Scope' }
        client_scope: { $ref: '#/components/schemas/ClientScope' }
        client_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
          description: Obligatorio y no vacío si client_scope=own; prohibido si all.
        rate_limit_per_minute: { type: integer, minimum: 1, maximum: 6000, default: 60 }
        credential_ttl_days: { type: [integer, 'null'], minimum: 1, maximum: 730 }
    Integration:
      type: object
      required: [id, slug, name, status, scopes, clientScope, manifestVersion, rateLimitPerMinute, createdAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/IntegrationStatus' }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
        clientScope: { $ref: '#/components/schemas/ClientScope' }
        clientIds: { type: array, items: { type: string, format: uuid } }
        manifestVersion: { type: string }
        manifest: { $ref: '#/components/schemas/IntegrationManifest' }
        rateLimitPerMinute: { type: integer }
        activeCredentials: { type: integer }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IntegrationCreate:
      type: object
      required: [manifest]
      additionalProperties: false
      properties:
        manifest: { $ref: '#/components/schemas/IntegrationManifest' }
    IntegrationUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        status: { $ref: '#/components/schemas/IntegrationStatus' }
    IntegrationPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Integration' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    ApiCredential:
      type: object
      required: [id, integrationId, keyPrefix, createdAt]
      properties:
        id: { type: string, format: uuid }
        integrationId: { type: string, format: uuid }
        keyPrefix: { type: string, examples: [fsk_live_a1b2c3d4] }
        label: { type: [string, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    ApiCredentialCreate:
      type: object
      additionalProperties: false
      properties:
        label: { type: [string, 'null'], maxLength: 100 }
        expiresAt: { type: [string, 'null'], format: date-time }
    ApiCredentialCreated:
      allOf:
        - $ref: '#/components/schemas/ApiCredential'
        - type: object
          required: [apiKey]
          properties:
            apiKey: { type: string, description: Secreto completo. Se muestra una única vez; no se puede recuperar. }

    AuditLog:
      type: object
      required: [id, occurredAt, actorType, action, resourceType, resourceId]
      properties:
        id: { type: string, description: bigint serializado como string }
        occurredAt: { type: string, format: date-time }
        actorType: { $ref: '#/components/schemas/ActorType' }
        actor:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        action: { type: string, examples: [subscription.renewed] }
        resourceType: { type: string }
        resourceId: { type: string }
        clientId: { type: [string, 'null'], format: uuid }
        changes:
          type: [object, 'null']
          description: '{ before, after } ya redactado (sin secretos)'
        reason: { type: [string, 'null'] }
        requestId: { type: [string, 'null'] }
    AuditLogPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    Settings:
      type: object
      additionalProperties: false
      properties:
        contactChannel:
          type: object
          additionalProperties: false
          properties:
            email: { type: [string, 'null'], format: email }
            phone: { type: [string, 'null'], maxLength: 30 }
            hours: { type: [string, 'null'], maxLength: 200 }
