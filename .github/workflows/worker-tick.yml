name: worker-tick

on:
  schedule:
    # Cada 30 minutos: aproximación gratuita al worker persistente sin agotar
    # las horas de cómputo de Neon free.
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: fabsoft-worker-tick
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile --prod=false
      - name: Compilar paquete compartido
        run: pnpm --filter @fabsoft/shared build
      - name: Ejecutar pasada del worker
        run: pnpm --filter @fabsoft/backend worker:tick
        env:
          NODE_ENV: production
          APP_ENV: prod
          APP_VERSION: 0.1.0
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          DATABASE_SSL_MODE: verify-full
          DB_POOL_MAX: 2
          BUSINESS_TIMEZONE: America/Bogota
          CORREO_CANAL: resend
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CORREO_DESDE: ${{ secrets.CORREO_DESDE }}
          RESEND_MAX_RPS: 2
          FRONTEND_URL: https://gestion-fabsoft.vercel.app
