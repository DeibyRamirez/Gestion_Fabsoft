name: api-keepalive

on:
  schedule:
    # 11:00–23:50 UTC = 06:00–18:50 America/Bogota (horario laboral).
    # Fuera de esta ventana la API free puede dormirse y el primer request tarda ~50 s.
    - cron: '*/10 11-23 * * *'
  workflow_dispatch:

concurrency:
  group: fabsoft-api-keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Despertar API free de Render
        run: >-
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 120
          https://fabsoft-api.onrender.com/api/v1/health
